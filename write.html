<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>게시판 | 글내용</title>
</head>
<body>
    <!-- 공통 상단 메뉴-->
    <header>
        <div class="logo">
            <a href="index.html">GOOKBBONG PHARMA</a>
        </div>
        <nav>
            <a href="index.html">홈</a>
            <a href="#">회사소개</a>
            <a href="#">제품소개</a>
            <a href="board.html">게시판</a>
        </nav>
    </header>

    <!-- 게시판 목록 -->
    <main>
        <!-- 게시판 검색 입력-->
        <section class="page-title">
            <h1>게시판</h1>
            <p>GOOKBBONG PHARMA의 새로운 소식을 확인하세요.</p>
        </section>

        <section class="content-section form-section">
            <h2>글쓰기</h2>
            <form>
                <label>제목</label>
                <input type="text" id="title" placeholder="제목을 입력하세요">

                <label>작성자</label>
                <input type="text" id="writer" placeholder="작성자를 입력하세요">

                <label>내용</label>
                <textarea id="content" rows="10" placeholder="내용을 입력하세요"></textarea>
            </form>

            <div class="form-button">
                <button type="submit" class="button">등록하기</button>
                <a href="board.html" class="button button-gray">취소하기</a>
            </div>
            
        </section>
    </main>

    <!-- 공통 하단 footer -->
    <footer>
        <p>GOOKBBONG PHARMA</p>
        <p>주소 : 서울특별시 건강로 123 | 대표전화: 02-1234-5678</p>
        <small>Copyright 2025 GOOKBBONG PHARMA. All rights reserved.</small>
    </footer>
</body>
</html>
